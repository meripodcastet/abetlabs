<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abet Labs | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/Geist-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/Geist-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/Geist-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --indigo: #232368;
            --azure: #5085F9;
            --white: #FFFFFF;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--indigo);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
        }

        /* Animated background gradient */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(80, 133, 249, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(80, 133, 249, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse 60% 40% at 20% 100%, rgba(80, 133, 249, 0.08) 0%, transparent 40%),
                linear-gradient(180deg, var(--indigo) 0%, #1a1a4a 100%);
            z-index: 0;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--azure);
            border-radius: 50%;
            opacity: 0;
            animation: float-up 8s infinite;
        }

        @keyframes float-up {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1);
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Hero section with image */
        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .hero-image-wrapper {
            position: relative;
            max-width: 1400px;
            width: 100%;
            animation: hero-reveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px) scale(0.98);
        }

        @keyframes hero-reveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero-image {
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 
                0 0 0 1px rgba(80, 133, 249, 0.1),
                0 30px 60px -20px rgba(0, 0, 0, 0.5),
                0 60px 120px -40px rgba(0, 0, 0, 0.4),
                0 0 120px -20px rgba(80, 133, 249, 0.2);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s ease;
        }

        .hero-image-wrapper:hover .hero-image {
            transform: scale(1.01);
            box-shadow: 
                0 0 0 1px rgba(80, 133, 249, 0.15),
                0 40px 80px -20px rgba(0, 0, 0, 0.6),
                0 80px 160px -40px rgba(0, 0, 0, 0.5),
                0 0 150px -20px rgba(80, 133, 249, 0.3);
        }

        /* Glow effect behind image */
        .hero-glow {
            position: absolute;
            inset: -100px;
            background: radial-gradient(ellipse at center, rgba(80, 133, 249, 0.15) 0%, transparent 60%);
            z-index: -1;
            filter: blur(60px);
            animation: glow-pulse 4s ease-in-out infinite alternate;
        }

        @keyframes glow-pulse {
            from {
                opacity: 0.5;
                transform: scale(0.95);
            }
            to {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* Bottom section */
        .bottom-section {
            padding: 40px 20px 60px;
            text-align: center;
            animation: fade-up 1s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fade-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tagline {
            font-family: 'Geist', sans-serif;
            font-size: 18px;
            font-weight: 300;
            color: var(--white);
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto;
        }

        .tagline strong {
            font-weight: 300;
        }

        .tagline a {
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: border-color 0.3s ease;
        }

        .tagline a:hover {
            border-bottom-color: var(--white);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                padding: 15px;
            }
            
            .hero-image {
                border-radius: 12px;
            }

            .bottom-section {
                padding: 30px 20px 50px;
            }

            .tagline {
                font-size: 16px;
            }
        }

        /* Scanline effect */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.02) 2px,
                rgba(0, 0, 0, 0.02) 4px
            );
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>
    <div class="scanlines"></div>

    <div class="container">
        <div class="hero">
            <div class="hero-image-wrapper">
                <div class="hero-glow"></div>
                <img src="0060.jpg" alt="Abet Labs - Coming Soon" class="hero-image">
            </div>
        </div>

        <div class="bottom-section">
            <p class="tagline">We're building a new website for <strong>Abet Labs</strong>. For careers, email us at <a href="mailto:jobs@abetlabs.com">jobs@abetlabs.com</a>.</p>
        </div>
    </div>

    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 8 + 's';
            particle.style.animationDuration = (6 + Math.random() * 4) + 's';
            particlesContainer.appendChild(particle);
        }

        // Parallax effect on mouse move
        const heroWrapper = document.querySelector('.hero-image-wrapper');

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            
            heroWrapper.style.transform = `
                perspective(1000px)
                rotateY(${x * 2}deg)
                rotateX(${-y * 2}deg)
            `;
        });

        // Reset transform on mouse leave
        document.addEventListener('mouseleave', () => {
            heroWrapper.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg)';
        });
    </script>
</body>
</html>
